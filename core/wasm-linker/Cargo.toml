[package]
name = "inference-wasm-linker"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
description = "Static-merge linker: folds external `.wasm` function bodies into the main module so no cross-module imports remain"
keywords = ["compiler", "webassembly", "linker", "wasm"]
categories = ["compilers", "wasm"]

[dependencies]
wasm-encoder.workspace = true
inf-wasmparser.workspace = true
inference-fn-key.workspace = true
inference-hassert.workspace = true
thiserror.workspace = true

[dev-dependencies]
wat.workspace = true
inf-wasmparser = { workspace = true }
inference-wasm-to-v-translator = { workspace = true }
rustc-hash = { workspace = true }
# Runs the provenance fixtures for real, so the analysis verdict can be compared
# against the addresses a module actually touches. The comparison needs the
# crate-private `verify_param_addressing`, so it lives in an in-crate test module
# rather than an integration test.
# wasmtime's default features minus `cache`, its on-disk compiled-module cache,
# which nothing here enables (see tests/Cargo.toml). That feature alone pulls in zstd 0.13, which has
# open advisories (RUSTSEC-2026-0391/0398/0403) and no fixed release wasmtime 48 accepts.
wasmtime = { version = "48.0.3", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling",
    "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins",
    "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug",
    "compile-time-builtins", "wit-parser"] }
