[package]
name = "inference-tests"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
anyhow.workspace = true
getrandom = "0.4"
same-file = "1.0.6"
tempfile = "3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
wasmtime="47.0.3"

inference-analysis.workspace = true
inference-ast.workspace = true
inference-hassert.workspace = true
inference-parser.workspace = true
# A NORMAL dependency, not a dev-dependency: `src/corpus.rs` is compiled into
# the library, and the Stellar host tier is an integration binary that reaches
# the compile helpers through it.
inference-stellar-abi.workspace = true
# A NORMAL dependency for the same reason: the conformance sweeps live in
# `src/codegen/wasm/spacewasm_conformance.rs`, which is compiled into the
# library.
inference-target-conformance.workspace = true
inference-wasm-codegen.workspace = true
inference-wasm-to-v-translator.workspace = true
inference-type-checker = { workspace = true, features = ["test-utils"] }
inference.workspace = true
inf-wasmparser.workspace = true
rustc-hash.workspace = true
wasmprinter = "0.245.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
cov-mark = { workspace = true, features = ["enable"] }
wasmparser = "0.245.1"
wat = "1.225.0"
wasm-encoder.workspace = true

# The Soroban contract host, used only by the `stellar` integration binary to
# upload and invoke hand-assembled modules in-process. The host is chosen over
# `soroban-sdk` deliberately: it is Apache-2.0, its MSRV sits well under this
# workspace's, it accepts raw `&[u8]` module bytes, and it never writes test
# snapshot files into the crate directory.
soroban-env-host = { version = "=28.0.2", features = ["testutils"] }

# The contract-spec reader, used only by the `stellar` integration binary to
# decode the `contractspecv0` section a compiled contract carries. It is chosen
# because the `stellar` CLI runs it: `stellar contract bindings rust --wasm
# <file>` decodes the file's spec with `soroban_spec::read::from_wasm`, as the
# Soroban SDK's `contractimport!` does, and the CLI 28.0.0 locks 28.0.0-rc.1,
# whose reader is byte-identical, so a spec it decodes is one the CLI decodes.
# `stellar contract invoke` reads through `soroban-spec-tools`' `Spec::new`
# instead, which the binary mirrors with `stellar-xdr`'s own readers rather
# than taking as a second dependency.
#
# The `=`-pin follows from the host's: this crate pins `stellar-xdr =28.0.0`,
# the same crate and version the host pins, and the two pins have to move
# together — two exact pins within one major version do not resolve, and
# across two majors `soroban_spec` would hand back a different crate's types
# from the ones the host and this tier are built on.
#
# The `serde` feature it requires of `stellar-xdr` brings `serde_with` and its
# macro crates into the build.
soroban-spec = "=28.0.0"

# The case-conversion crate `stellar contract invoke` derives each parameter's
# second flag with (`heck` 0.5.0, the version stellar-cli 28.0.0 locks), used
# only by the `stellar` integration binary. It is taken so the compiler's
# transcription, `inference_wasm_codegen::stellar_cli_flag_alias`, is pinned
# against the real algorithm rather than against a second reading of it. It
# has no dependencies of its own.
# The `=`-pin holds the transcription to the version the CLI locks rather than
# to whatever 0.5.x resolves. It has the cost the `spacewasm` entry below
# records of its own pin: an exact pin stops resolving if another dependency
# later needs a newer 0.5.x, and that is the moment to re-read the CLI's lock.
heck = "=0.5.0"

# The SpaceWasm flight interpreter, used only by the `spacewasm` integration
# binary to decode, instantiate and execute compiler output in-process. It is
# chosen because it *is* the runtime the target names: a `no_std` WebAssembly
# 1.0 decoder with no post-MVP proposal support, which is what makes it an
# oracle for the target's bulk-memory refusal rather than a second opinion.
# The `=`-pin is the point rather than caution — the decoder's acceptance set is
# what this tier records, so a version bump has to be a reviewed act with the
# sweeps re-measured. `strict-assertions` is upstream's own dev-dependency
# setting: it re-checks at run time the bounds the verifier established, so it
# can only make this tier stricter, never let a module through that the default
# build would reject.
# It brings one exact pin of its own, `libm =0.2.16`, and `libm` is shared with
# cranelift and wasmtime: a future bump that needs a newer `libm` is
# unresolvable until this pin moves, and that failure surfaces far from here.
spacewasm = { version = "=0.7.1", features = ["strict-assertions"] }
