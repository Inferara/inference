[workspace]

resolver = "2"

members = [
    "core/*",
    "ide/*",
    "apps/*",
    "tools/*",
    "tests"
]

default-members = [
    "core/*",
    "ide/*",
    "apps/*",
    "tests"
]

[workspace.package]
version = "0.0.1"
rust-version = "1.91"
edition = "2024"
license = "GPL-3.0"
homepage = "https://inferara.com"
repository = "https://github.com/Inferara/inference"

[workspace.dependencies]
# Core Inference crates
inference = { path = "./core/inference", version = "0.0.1" }
inference-project-model = { path = "./core/project-model", version = "0.0.1" }
inference-ast = { path = "./core/ast", version = "0.0.1" }
inference-parser = { path = "./core/parser", version = "0.0.1" }
inference-type-checker = { path = "./core/type-checker", version = "0.0.1" }
inference-cli = { path = "./core/cli", version = "0.0.1" }
inference-wasm-to-v-translator = { path = "./core/wasm-to-v", version = "0.0.1" }
inference-wasm-codegen = { path = "./core/wasm-codegen", version = "0.0.1" }
inference-wasm-linker = { path = "./core/wasm-linker", version = "0.0.1" }
inference-analysis = { path = "./core/analysis", version = "0.0.1" }
inference-compiler-interface = { path = "./core/compiler-interface", version = "0.0.1" }
inference-fn-key = { path = "./core/fn-key", version = "0.0.1" }
inference-hassert = { path = "./core/hassert", version = "0.0.1" }

# IDE support crates
inference-base-db = { path = "./ide/base-db", version = "0.0.1" }
inference-ide = { path = "./ide/ide", version = "0.0.1" }
inference-ide-db = { path = "./ide/ide-db", version = "0.0.1" }
inference-vfs = { path = "./ide/vfs", version = "0.0.1" }

# Applications
infs = { path = "./apps/infs", version = "0.0.1" }
inference-lsp = { path = "./apps/lsp", version = "0.0.1" }

# Test suite
inference-tests = { path = "./tests", version = "0.0.1" }

# Various supplementary tools
wasm-fmt = { path = "./tools/wasm-fmt", version = "0.0.1" }
wat-fmt = { path = "./tools/wat-fmt", version = "0.0.9" }
inf-wast = { path = "./tools/inf-wast", version = "0.0.9" }
inf-wasmparser = { path = "./tools/inf-wasmparser", version = "0.0.9" }
wasm-encoder = "0.254.0"

anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
toml = "1.1.4"
cov-mark = { version = "2.2.0", default-features = false }
leb128 = "0.2.7"
rustc-hash = "2.1.3"
# Held at 0.27.x to match rust-analyzer's pin — this stack's architectural
# reference, and the source of the IDE-layer patterns we mirror. Revisit when RA
# moves (#157).
salsa = "0.27"

# Debug builds carry full DWARF by default, for this workspace *and* for every
# dependency in it — including Wasmtime and Cranelift, which the test suite
# links. That debuginfo is the bulk of both the link time and the tens of
# gigabytes a debug build leaves in `target/`, and almost none of it is ever
# read: a failing test is located by the file and line in its backtrace, which
# is what `line-tables-only` keeps.
[profile.dev]
debug = "line-tables-only"

# Dependencies are not stepped through, so they carry no debuginfo at all. This
# is the larger half of the saving, because the heaviest crates in the graph are
# ones nobody debugs from here.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1     # Better optimization (slower compile)
