[workspace]

resolver = "2"

members = [
    "core/*",
    "ide/*",
    "apps/*",
    "tools/*",
    "tests"
]

default-members = [
    "core/*",
    "ide/*",
    "apps/*",
    "tests"
]

[workspace.package]
version = "0.0.1"
rust-version = "1.91"
edition = "2024"
license = "GPL-3.0"
homepage = "https://inferara.com"
repository = "https://github.com/Inferara/inference"

[workspace.dependencies]
# Core Inference crates
inference = { path = "./core/inference", version = "0.0.1" }
inference-project-model = { path = "./core/project-model", version = "0.0.1" }
inference-ast = { path = "./core/ast", version = "0.0.1" }
inference-parser = { path = "./core/parser", version = "0.0.1" }
inference-type-checker = { path = "./core/type-checker", version = "0.0.1" }
inference-cli = { path = "./core/cli", version = "0.0.1" }
inference-wasm-to-v-translator = { path = "./core/wasm-to-v", version = "0.0.1" }
inference-wasm-codegen = { path = "./core/wasm-codegen", version = "0.0.1" }
inference-wasm-linker = { path = "./core/wasm-linker", version = "0.0.1" }
inference-stellar-abi = { path = "./core/stellar-abi", version = "0.0.1" }
inference-target-conformance = { path = "./core/target-conformance", version = "0.0.1" }
inference-spacewasm-runner = { path = "./core/spacewasm-runner", version = "0.0.1" }
inference-analysis = { path = "./core/analysis", version = "0.0.1" }
inference-compiler-interface = { path = "./core/compiler-interface", version = "0.0.1" }
inference-fn-key = { path = "./core/fn-key", version = "0.0.1" }
inference-hassert = { path = "./core/hassert", version = "0.0.1" }

# IDE support crates
inference-base-db = { path = "./ide/base-db", version = "0.0.1" }
inference-ide = { path = "./ide/ide", version = "0.0.1" }
inference-ide-db = { path = "./ide/ide-db", version = "0.0.1" }
inference-vfs = { path = "./ide/vfs", version = "0.0.1" }

# Applications
infs = { path = "./apps/infs", version = "0.0.1" }
inference-lsp = { path = "./apps/lsp", version = "0.0.1" }

# Test suite
inference-tests = { path = "./tests", version = "0.0.1" }

# Various supplementary tools
wasm-fmt = { path = "./tools/wasm-fmt", version = "0.0.1" }
wat-fmt = { path = "./tools/wat-fmt", version = "0.0.9" }
inf-wast = { path = "./tools/inf-wast", version = "0.0.9" }
inf-wasmparser = { path = "./tools/inf-wasmparser", version = "0.0.9" }
wasm-encoder = "0.254.0"
# Stock upstream wasmparser, held at the version `wasm-encoder` is held at.
# Distinct from `inf-wasmparser` above and not a replacement for it: the fork
# accepts the custom non-deterministic opcodes unconditionally, so only the
# stock decoder can answer "is this WebAssembly 1.0?". Default features are off
# because the compiler's consumers parse and validate a core module: no
# component model, no serde, no SIMD. The test code that reads modules with it
# takes the same set; `wasmprinter` below adds SIMD and the component model to
# any build that links it, which only test code does.
wasmparser = { version = "0.254.0", default-features = false, features = ["std", "validate", "features", "hash-collections"] }
# The text printer the test suites render modules with. The `.wat` goldens under
# `tests/test_data` are its output and are compared against it, so a bump that
# changes its text fails them. Held at the version `wasm-encoder` is held at, so
# it reads through the `wasmparser` above rather than a copy of its own.
wasmprinter = "0.254.0"
# The text assembler the test suites build hand-written modules with, held at
# the release that goes with `wasm-encoder` above: `wat` 1.254 parses through
# `wast` 254, which encodes with `wasm-encoder` 0.254, so no second encoder comes
# with it. A tilde, not a caret: `wat` is past 1.0, so a caret requirement floats
# to the newest 1.x, whose `wast` brings the newest `wasm-encoder`. Wasmtime's
# `wat` resolves to this one too, so a Wasmtime that needs a newer `wat` does not
# resolve until this entry moves with `wasm-encoder`.
wat = "~1.254.0"
# The SpaceWasm flight interpreter, the runtime the `spacewasm` target is named
# for: a `no_std` WebAssembly 1.0 decoder with no post-MVP proposal support.
# The `=`-pin is the point rather than caution — its acceptance set is what
# `inference-spacewasm-runner` loads against and what the test suite records,
# and `inference-target-conformance` transcribes its limits from this release,
# so a version bump has to be a reviewed act with the sweeps re-measured.
# Features are chosen by each dependent, not here.
# It brings one exact pin of its own, `libm =0.2.16`, and `libm` is shared with
# cranelift and wasmtime: a future bump that needs a newer `libm` is
# unresolvable until this pin moves, and that failure surfaces far from here.
# Release archives ship both crates' license texts, so a bump also re-copies
# `licenses/spacewasm` and `licenses/libm` from the new packages (see
# `licenses/README.md`); a test holds that file's versions to this pin.
spacewasm = { version = "=0.7.1" }

anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
toml = "1.1.4"
cov-mark = { version = "2.2.0", default-features = false }
leb128 = "0.2.7"
rustc-hash = "2.1.3"
# Held at 0.27.x to match rust-analyzer's pin — this stack's architectural
# reference, and the source of the IDE-layer patterns we mirror. Revisit when RA
# moves (#157).
salsa = "0.27"

# Debug builds carry full DWARF by default, for this workspace *and* for every
# dependency in it — including Wasmtime and Cranelift, which the test suite
# links. That debuginfo is the bulk of both the link time and the tens of
# gigabytes a debug build leaves in `target/`, and almost none of it is ever
# read: a failing test is located by the file and line in its backtrace, which
# is what `line-tables-only` keeps.
[profile.dev]
debug = "line-tables-only"

# Dependencies are not stepped through, so they carry no debuginfo at all. This
# is the larger half of the saving, because the heaviest crates in the graph are
# ones nobody debugs from here.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1     # Better optimization (slower compile)

# `infs` is the binary a user installs before any toolchain, and the one
# `infs self update` downloads again, so it is built for size as far as a
# per-package override of the shared release profile goes. `opt-level` applies
# to the code compiled into the `infs` crate, which includes the generic and
# inline code of its dependencies that `infs` instantiates; each dependency
# crate stays at the release default of 3. `strip` drops the symbol table from
# what the `infs` package builds and from nothing else, so a panic in a release
# `infs` still reports its message and source line, but its backtrace names
# none of `infs`'s functions. `lto` and `panic` cannot be set per package, and
# `panic = "abort"` across the release profile would break three binaries that
# unwind on purpose: `infs` restores the terminal its TUI took over in a `Drop`
# that an abort skips, `inference-lsp` answers a cancelled or panicking request
# by catching the unwind, and `infc` hands a panic on its compiler thread back
# to `main` by unwinding, which keeps its exit status. Cargo ignores a
# `[profile]` table in a member's own manifest, so these settings live here;
# `apps/infs/tests/workspace_profiles.rs` fails when a member declares one,
# when either setting below goes, and when `[profile.release]` gains `lto` or
# `panic = "abort"`.
[profile.release.package.infs]
opt-level = "z"
strip = true
